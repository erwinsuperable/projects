<style>:root { --paper:#F1F2EF; --card:#FAFBF9; --ink:#16211E; --ink2:#46504C; --green:#003C31; --navy:#1F304D; --gold:#9A7642; --line:#CDD2CC; --soft:#E4E7E2;
  --serif:'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif; --sans:'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper:#121815; --card:#18201C; --ink:#E7ECE8; --ink2:#AAB5AF; --green:#7FC4AE; --navy:#9DB2D6; --gold:#D2B079; --line:#34403A; --soft:#1F2925; color-scheme: dark; } }
:root[data-theme="dark"] { --paper:#121815; --card:#18201C; --ink:#E7ECE8; --ink2:#AAB5AF; --green:#7FC4AE; --navy:#9DB2D6; --gold:#D2B079; --line:#34403A; --soft:#1F2925; color-scheme: dark; }
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: calc(64px + env(safe-area-inset-top, 0px)); }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.6 var(--sans); overflow-x: hidden; }
a { color: inherit; text-underline-offset: 3px; }
button, input, select { font: inherit; color: inherit; }
:where(button, a, input, select, summary, [tabindex]):focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 3px; }
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 48px); }
.skip { position: absolute; left: -9999px; top: 8px; background: var(--ink); color: var(--paper); padding: 8px 12px; z-index: 100; }
.skip:focus { left: 8px; }
.muted { color: var(--ink2); }
.sr-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topin { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 60px; flex-wrap: wrap; }
.brand { margin: 0; font: 600 17px/1.2 var(--serif); }
.brand span { font: 400 13px var(--sans); color: var(--ink2); margin-left: 8px; }
.top nav { display: flex; gap: 4px; flex-wrap: wrap; }
.top nav button { background: none; border: 0; padding: 8px 10px; cursor: pointer; font-size: 14px; color: var(--ink2); border-radius: 4px; }
.top nav button:hover { color: var(--ink); background: var(--soft); }

.hero { padding: clamp(40px, 8vw, 96px) 0 clamp(32px, 6vw, 72px); border-bottom: 1px solid var(--line); }
.herogrid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: clamp(32px, 5vw, 80px); align-items: center; }
.kicker { margin: 0 0 16px; font-size: 14px; color: var(--ink2); }
h1 { font: 500 clamp(34px, 5.2vw, 68px)/1.04 var(--serif); letter-spacing: -0.035em; margin: 0 0 24px; max-width: 13ch; }
.lede { max-width: 64ch; color: var(--ink2); font-size: 17px; margin: 0 0 24px; }
.cta-big { background: var(--ink); color: var(--paper); border: 0; padding: 14px 22px; border-radius: 4px; cursor: pointer; font-weight: 600; }
.matrix { display: grid; grid-template-columns: auto 1fr 1fr; gap: 10px; align-items: stretch; }
.mx-h { font: 600 15px var(--sans); padding: 0 4px 4px; border-bottom: 3px solid; }
.mx-h.r-brand { border-color: var(--green); } .mx-h.r-muse { border-color: var(--navy); }
.mx-r { font: 500 20px/1 var(--serif); writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; color: var(--ink2); padding: 0 4px; }
.mx-cell { text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 18px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-height: 150px; border-left: 6px solid; transition: transform .15s; }
.mx-cell.r-brand { border-left-color: var(--green); } .mx-cell.r-muse { border-left-color: var(--navy); }
.mx-cell:hover { transform: translateY(-2px); }
@media (prefers-reduced-motion: reduce) { .mx-cell { transition: none; } .mx-cell:hover { transform: none; } }
.mx-id { font: 500 34px/1 var(--serif); }
.mx-l { font-weight: 600; line-height: 1.3; }
.mx-n { font-size: 14px; color: var(--ink2); margin-top: auto; }

.sec-h { font: 500 clamp(26px, 3vw, 38px)/1.15 var(--serif); margin: 0 0 16px; letter-spacing: -0.025em; }
.split, .decisions, .sources { padding: clamp(40px, 6vw, 80px) 0; border-bottom: 1px solid var(--line); }
.two { display: grid; grid-template-columns: 1fr 1.2fr; gap: clamp(24px, 5vw, 72px); }
.two p { max-width: 62ch; }
.defs { margin: 0; display: grid; gap: 20px; }
.defs div { border-top: 1px solid var(--line); padding-top: 14px; }
.defs dt { font: 600 18px var(--serif); margin-bottom: 4px; }
.defs dd { margin: 0; color: var(--ink2); max-width: 70ch; }
.defs.small dd { font-size: 15px; }

/* explorer */
.explorer { padding: clamp(40px, 6vw, 72px) 0 32px; border-bottom: 1px solid var(--line); }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 24px 0 0; }
.tab { text-align: left; border: 1px solid var(--line); border-bottom: 0; background: var(--soft); border-radius: 6px 6px 0 0; padding: 12px 14px; cursor: pointer; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; row-gap: 2px; align-items: baseline; }

.tab .t-n { font-size: 12px; color: var(--ink2); }
.tab[aria-selected="true"] { background: var(--card); box-shadow: inset 0 4px 0 var(--green); }
.tab.r-muse[aria-selected="true"] { box-shadow: inset 0 4px 0 var(--navy); }
.panel { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 24px; background: var(--card); border: 1px solid var(--line); border-radius: 0 0 6px 6px; padding: 20px clamp(12px, 2vw, 24px) 24px; }
.catalogue { position: sticky; top: 76px; align-self: start; max-height: calc(100vh - 96px); display: flex; flex-direction: column; min-height: 0; }
.ql { font-size: 13px; color: var(--ink2); margin-bottom: 4px; }
.catalogue input { width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 4px; padding: 8px 10px; margin-bottom: 8px; }
.sclist { list-style: none; margin: 0; padding: 0; overflow-y: auto; min-height: 0; }
.sclist a { display: grid; grid-template-columns: 50px 1fr; gap: 6px; padding: 8px 8px; text-decoration: none; border-radius: 4px; font-size: 14px; line-height: 1.35; border-left: 3px solid transparent; }
.sclist a:hover { background: var(--soft); }
.sclist a[aria-current="true"] { background: var(--soft); border-left-color: var(--green); font-weight: 600; }
.r-muse .sclist a[aria-current="true"] { border-left-color: var(--navy); }
.sl-id { font-variant-numeric: tabular-nums; color: var(--ink2); }
.compact { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 4px; }
.compact label { font-size: 13px; color: var(--ink2); }
.compact select { padding: 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); width: 100%; }
.active { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.brief { border-bottom: 1px solid var(--line); padding-bottom: 16px; }
.b-id { margin: 0; font: 500 15px var(--sans); color: var(--ink2); }
.b-id span { font-weight: 400; font-size: 13px; }
.brief h3 { font: 400 clamp(24px, 2.6vw, 32px)/1.15 var(--serif); margin: 4px 0 12px; }
.bdl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin: 0 0 16px; }
.bdl dt { font-size: 12px; color: var(--ink2); font-weight: 600; letter-spacing: .02em; }
.bdl dd { margin: 2px 0 0; font-size: 15px; line-height: 1.45; }
.bdl.small { grid-template-columns: 1fr; gap: 8px; margin-top: 12px; }
.brow { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.try { background: var(--green); color: #fff; border: 0; border-radius: 4px; padding: 12px 20px; font-weight: 600; cursor: pointer; }
.r-muse .try { background: var(--navy); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .try { color: #0d1411; } }
.cf { flex: 1; min-width: 240px; font-size: 14px; }
.cf summary { cursor: pointer; padding: 12px 0; font-weight: 600; }

.player { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.pmain { min-width: 0; }
.player.wide { grid-template-columns: minmax(0, 1fr) 330px; }
.phead { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.step { margin: 0; font-size: 14px; }
.step .node { color: var(--ink2); font-size: 13px; margin-left: 6px; }
.pctl { display: flex; gap: 6px; flex-wrap: wrap; }
.pctl button { border: 1px solid var(--line); background: var(--paper); border-radius: 4px; padding: 7px 12px; font-size: 14px; cursor: pointer; }
.pctl button[aria-pressed="true"] { background: var(--soft); }
.pctl .ext { border-color: var(--gold); }
.pctl .pres, .pctl .exit { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.stage { width: 100%; overflow: hidden; }
.stage.native { overflow: auto; border: 1px dashed var(--line); border-radius: 6px; }
.feedback { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.outcome { border: 1px solid var(--line); border-left: 6px solid var(--green); background: var(--paper); padding: 14px 16px; border-radius: 4px; }
.outcome.o-cancel { border-left-color: var(--ink2); } .outcome.o-blocked { border-left-color: #A3362E; } .outcome.o-pending, .outcome.o-choice { border-left-color: var(--gold); }
.outcome p { margin: 0; } .o-k { font-size: 13px; color: var(--ink2); } .o-l { font: 500 20px/1.3 var(--serif); margin: 2px 0 6px !important; } .o-d { font-size: 14px; color: var(--ink2); }
.sbtn-p { margin-top: 10px; border: 1px solid var(--ink); background: none; border-radius: 4px; padding: 6px 12px; cursor: pointer; }
.notes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.notes li { font-size: 14px; padding: 8px 12px; border-radius: 4px; background: var(--soft); border-left: 3px solid var(--line); }
.notes .n-error { border-left-color: #A3362E; } .notes .n-flag { border-left-color: var(--gold); } .notes .n-effect { border-left-color: var(--green); }
.notes li:not(:first-child) { opacity: .7; }
.pside { font-size: 14px; min-width: 0; }
.notesw details { border-top: 1px solid var(--line); padding: 10px 0; }
.notesw summary { cursor: pointer; font-weight: 600; }
.tight { margin: 8px 0 0; padding-left: 18px; } .tight li { margin-bottom: 6px; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; margin: 8px 0; }
.kv dt { color: var(--ink2); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.chip { display: inline-block; font-size: 12px; background: var(--soft); border-radius: 3px; padding: 1px 6px; margin: 0 4px 4px 0; }
.consents { padding-left: 18px; margin: 8px 0 0; } .consents li { margin-bottom: 8px; } .consents span { color: var(--ink2); font-size: 13px; }
.crossnote { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 6px; font-size: 14px; max-width: min(92vw, 640px); z-index: 30; }

/* presentation */
.present { position: fixed; inset: 0; z-index: 50; background: var(--paper); display: flex; flex-direction: column; padding: env(safe-area-inset-top, 0px) clamp(12px, 3vw, 32px) env(safe-area-inset-bottom, 0px); overflow: auto; }
.pbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.pbar h2 { font: 400 24px/1.2 var(--serif); margin: 0; } .pid { margin: 0; font-size: 13px; color: var(--ink2); }
.pbody { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; padding: 16px 0; min-height: 0; }
.pbody.with { grid-template-columns: minmax(0, 1fr) 340px; }
.pnotes { font-size: 14px; overflow: auto; }
.pstage { min-width: 0; }

/* decisions */
.dlist { padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin: 0 0 48px; }
.dlist li { border-top: 2px solid var(--ink); padding-top: 12px; color: var(--ink2); font-size: 15px; }
.dlist b { display: block; color: var(--ink); font: 600 18px/1.3 var(--serif); margin-bottom: 4px; }
.od { max-width: 90ch; padding-left: 22px; margin: 0 0 48px; } .od li { margin-bottom: 10px; } .od em { display: block; color: var(--gold); font-style: normal; font-size: 14px; }
.tblw { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
.reg { border-collapse: collapse; width: 100%; min-width: 980px; font-size: 13.5px; }
.reg th, .reg td { text-align: left; vertical-align: top; padding: 10px; border-bottom: 1px solid var(--line); }
.reg thead th { background: var(--soft); font-weight: 600; position: sticky; top: 0; }
.reg tbody th { font-variant-numeric: tabular-nums; white-space: nowrap; }
.pagefoot { padding: 32px 0 48px; font-size: 13px; color: var(--ink2); }

@media (max-width: 1100px) { .herogrid, .two { grid-template-columns: 1fr; } .bdl { grid-template-columns: 1fr; } .pbody.with { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 899px) { .panel { grid-template-columns: minmax(0, 1fr); } .tabs { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 520px) { .tabs { grid-template-columns: 1fr 1fr; } .tab .t-n { display: none; } .tab { padding: 10px; } .matrix { grid-template-columns: auto 1fr 1fr; gap: 6px; } .mx-cell { padding: 12px; min-height: 120px; } .mx-id { font-size: 26px; } .mx-l { font-size: 13px; } .kv { grid-template-columns: 1fr; } }

.arch { padding: clamp(40px, 6vw, 80px) 0; border-bottom: 1px solid var(--line); }
.core { list-style: none; padding: 0; margin: 8px 0 56px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 0 32px; }
.core li { display: grid; grid-template-columns: 40px 1fr; gap: 8px; border-top: 1px solid var(--line); padding: 14px 0; }
.core .cn { font: 500 14px/1.6 var(--sans); color: var(--ink2); font-variant-numeric: tabular-nums; }
.core p { margin: 0; font-size: 15px; line-height: 1.55; }
.core b { font-weight: 600; }
.gloss { margin: 8px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.gloss div { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 16px; }
.gloss dt { font-weight: 600; font-size: 17px; margin-bottom: 4px; }
.gloss dd { margin: 0; color: var(--ink2); font-size: 15px; }
.gloss .scope { display: block; margin-top: 8px; font-size: 13px; }
.gloss code { font: 500 12px/1 ui-monospace, 'SF Mono', Menlo, monospace; background: var(--soft); padding: 3px 6px; border-radius: 3px; color: var(--ink); }

/* Product styles — isolated under .pr. Values from Figma file kF8nkDh6uXuQO3qERd8qUe (6 Nov 2026). */
.pr, .pr * { box-sizing: border-box; margin: 0; padding: 0; }
.pr { --ink:#09090b; --body:#212121; --muted:#717179; --line:#a1a1a9; --line2:#d4d4d8; --fill:#f4f4f5; --err:#911f1c; --btn:#121215;
  --geist:'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif; --serif:'Literata', Georgia, serif;
  --sf:-apple-system, 'SF Pro Text', 'SF Pro', system-ui, 'Helvetica Neue', Arial, sans-serif;
  font-family: var(--geist); color: var(--body); -webkit-font-smoothing: antialiased; text-align: left; line-height: normal; }
.pr button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: inherit; }
.pr input, .pr select { font: inherit; color: inherit; background: none; border: 0; outline: 0; min-width: 0; }
.pr :focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
.pr .ms { font-family: 'Material Symbols Outlined'; font-weight: 300; font-style: normal; line-height: 1; letter-spacing: 0; text-transform: none; white-space: nowrap; direction: ltr; -webkit-font-feature-settings: 'liga'; font-feature-settings: 'liga'; display: inline-block; overflow: hidden; width: 1em; height: 1em; flex: none; }

/* device shell (iPhone13 component, 430×884) */
.pr.dev { position: relative; width: 438px; height: 884px; }
.pr .shell { position: absolute; left: 4px; top: 0; width: 430px; height: 884px; border-radius: 68px;
  background: linear-gradient(160deg,#3b3b3b 0%,#1c1c1c 45%,#2f2f2f 100%);
  box-shadow: inset 0 0 5px #464646, inset 0 0 4px #5e5e5e, inset 0 1px 1px #464646; }
.pr .glass { position: absolute; inset: 6px; border-radius: 62px; background: #000; box-shadow: 0 0 2px rgba(0,0,0,.5), inset 0 0 9px rgba(255,255,255,.25); }
.pr .hw { position: absolute; width: 4px; background: linear-gradient(90deg,#1e1e1e,#4a4a4a); border-radius: 2px; }
.pr .scr { position: absolute; left: 24px; top: 20px; width: 390px; height: 844px; border-radius: 46px; overflow: hidden; background: #e2e2e2; isolation: isolate; }
.pr .notch { position: absolute; left: 97px; top: -4px; width: 195px; height: 37px; background: #000; border-radius: 0 0 22px 22px; z-index: 30; }
.pr .status { position: absolute; left: 0; top: 0; width: 390px; height: 44px; z-index: 29; pointer-events: none; }
.pr .status .time { position: absolute; left: 21px; top: 14px; width: 54px; height: 18px; text-align: center; font: 600 15px/18px var(--sf); letter-spacing: -0.165px; color: #000; }
.pr .status svg { position: absolute; left: 308px; top: 16px; }

/* iOS sheet */
.pr .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 16px 16px 0 0; display: flex; flex-direction: column; z-index: 1; }
.pr .grab { height: 10px; flex: none; display: flex; justify-content: center; padding-top: 6px; }
.pr .grab i { width: 60px; height: 4px; border-radius: 100px; background: #ccc; }
.pr .tb { height: 60px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; }
.pr .tbtn { width: 44px; height: 44px; border-radius: 100px; display: grid; place-items: center; }
.pr .tbtn.x { background: rgba(116,116,128,.08); box-shadow: 0 0 0 0 #ebebeb; }
.pr .tbtn.b { background: radial-gradient(circle at 50% 30%, rgba(255,255,255,.95), rgba(248,248,248,.8)); box-shadow: 0 8px 15px rgba(0,0,0,.02), 0 0 0 .5px #e8e8e8, -1.25px 0 0 -.5px #d0d0d0, 1.25px 0 0 -.5px #d0d0d0; }
.pr .content { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
.pr .content::-webkit-scrollbar { display: none; }
.pr .slot { display: flex; flex-direction: column; gap: 24px; padding: 16px; }
.pr .slot.flush { padding: 0; gap: 0; }

/* type */
.pr .h { font: 500 20px/28px var(--serif); color: var(--ink); }
.pr .p { font: 300 16px/24px var(--geist); color: var(--body); }
.pr .p + .p { margin-top: var(--ps, 20px); }
.pr .p.gap { height: 24px; margin-top: 0; }
.pr .m { font: 500 16px/24px var(--geist); color: #0f0f0f; }
.pr .or { font: 300 16px/24px var(--geist); text-align: center; }
.pr .u { text-decoration: underline; text-underline-offset: 2px; }
.pr .cap { font: 300 10px/12px var(--geist); color: var(--muted); }

/* buttons */
.pr .btn { height: 48px; width: 100%; border-radius: 4px; padding: 12px 16px; display: flex; align-items: center; justify-content: center; gap: 8px; font: 500 16px/24px var(--geist); text-align: center; }
.pr .btn.solid { background: var(--btn); color: #fff; }
.pr .btn.ghost { border: 1px solid var(--line); color: #18181b; }
.pr .btn .ms { font-size: 24px; }
.pr .spin { animation: prspin 1s linear infinite; }
@keyframes prspin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .pr .spin { animation: none; } }
.pr .cta { display: flex; flex-direction: column; gap: 8px; }

/* text field (floating label) */
.pr .tf { position: relative; }
.pr .tf .fld { height: 48px; border: 1px solid var(--line); border-radius: 4px; padding: 12px 16px; display: flex; align-items: center; gap: 8px; font: 400 16px/24px var(--geist); color: #18181b; }
.pr .tf.focus .fld { border: 2px solid #3f3f45; padding: 11px 15px; }
.pr .tf.err .fld { border-color: var(--err); }
.pr .tf .fld input { flex: 1; height: 24px; color: #18181b; }
.pr .tf .fld input::placeholder { color: var(--muted); opacity: 1; }
.pr .tf .lab { position: absolute; left: 8px; top: -8px; padding: 0 8px; background: #fff; font: 400 12px/16px var(--geist); color: var(--muted); white-space: nowrap; }
.pr .tf.err .lab { color: var(--err); }
.pr .tf .trail { width: 24px; height: 24px; display: grid; place-items: center; font-size: 16px; color: var(--ink); flex: none; }
.pr .sup { display: flex; gap: 4px; align-items: center; margin-top: 8px; font: 400 14px/18px var(--geist); color: var(--err); }
.pr .sup .ms { font-size: 16px; }
.pr .phone { display: flex; align-items: center; gap: 6px; flex: 1; font: 400 16px/24px var(--geist); color: #18181b; }
.pr .phone .ms { font-size: 16px; }

/* ident pill (Frame 19) */
.pr .pill { background: var(--fill); padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; }
.pr .pill.r8 { border-radius: 8px; padding: 16px; min-height: 56px; }
.pr .pill .txt { font: 300 16px/24px var(--geist); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pr .lnk { font: 500 16px/24px var(--geist); color: var(--body); text-decoration: underline; text-underline-offset: 2px; flex: none; }

/* OTP */
.pr .otp { display: flex; gap: 8px; }
.pr .otp .cell { width: 48px; height: 56px; border: 1px solid var(--line2); border-radius: 4px; display: grid; place-items: center; font: 400 16px/24px var(--geist); color: #18181b; position: relative; }
.pr .otp .cell.focus { border-color: #3f3f45; }
.pr .otp .cell.filled { color: var(--muted); }
.pr .otp .cell.error { border-color: var(--err); color: var(--err); }
.pr .otp input { position: absolute; inset: 0; opacity: 0; width: 100%; }
.pr .timer { display: flex; flex-direction: column; gap: 8px; }
.pr .timer b { font-weight: 600; }
.pr .row8 { display: flex; gap: 8px; align-items: center; }
.pr .tlink { font: 600 16px/24px var(--geist); color: #18181b; text-decoration: underline; text-underline-offset: 2px; }

/* checkbox / radio */
.pr .chk { display: flex; gap: 8px; align-items: flex-start; text-align: left; }
.pr .chk .box { width: 32px; height: 32px; flex: none; display: grid; place-items: center; }
.pr .chk.sm .box { width: 24px; height: 24px; }
.pr .chk .box i { width: 16px; height: 16px; border: 2px solid #18181b; border-radius: 2px; display: grid; place-items: center; }
.pr .chk .box i.on { background: #18181b; }
.pr .chk .box i.on::after { content: 'check'; font-family: 'Material Symbols Outlined'; color: #fff; font-size: 14px; font-style: normal; line-height: 1; }
.pr .chk .lbl { font: 300 16px/24px var(--geist); padding-top: 4px; }
.pr .chk.sm .lbl { padding-top: 0; }
.pr .radio { width: 24px; height: 24px; display: grid; place-items: center; flex: none; }
.pr .radio i { width: 16px; height: 16px; border: 1px solid var(--line); border-radius: 50%; display: grid; place-items: center; }
.pr .radio i.on { border-color: #18181b; }
.pr .radio i.on::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }

/* need help */
.pr .help { display: flex; flex-direction: column; gap: 8px; }
.pr .help .hd { display: flex; align-items: center; gap: 8px; font: 500 16px/24px var(--geist); width: max-content; }
.pr .help .hd .ms { font-size: 17px; font-weight: 600; color: #1a1a1a; }
.pr .help .it { font: 300 16px/24px var(--geist); text-align: left; }
.pr .helpblock { display: flex; flex-direction: column; gap: 16px; }
.pr .helpblock .cap { padding: 8px 0; }

/* welcome / entry */
.pr .w-in { display: flex; flex-direction: column; gap: 16px; padding: 16px; }
.pr .logo { display: flex; justify-content: center; }
.pr .social { display: flex; flex-direction: column; gap: 16px; }
.pr .div { display: flex; align-items: center; gap: 16px; }
.pr .div hr { flex: 1; border: 0; border-top: 1px solid #e4e4e7; }
.pr .sbtns { display: flex; justify-content: center; gap: 16px; }
.pr .sbtn { width: 48px; height: 48px; border: 1px solid #e4e4e7; border-radius: 99999px; display: grid; place-items: center; }
.pr .oa { background: var(--fill); padding: 16px; display: flex; flex-direction: column; gap: 32px; }
.pr .oa .h { text-align: center; color: var(--body); }
.pr .marquee { margin: 16px -16px 0; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
.pr .marquee .track { display: flex; width: max-content; animation: prmarquee 48s linear infinite; }
.pr .marquee:hover .track { animation-play-state: paused; }
.pr .marquee ul { list-style: none; display: flex; align-items: center; gap: 40px; padding-right: 40px; }
.pr .marquee li { display: flex; align-items: center; height: 32px; flex: none; }
.pr .marquee li svg { height: 24px; width: auto; }
.pr .marquee .wm { font: 600 12px/16px var(--geist); color: #8c8c8c; letter-spacing: .06em; white-space: nowrap; }
@keyframes prmarquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .pr .marquee { -webkit-mask-image: none; mask-image: none; margin: 16px 0 0; } .pr .marquee .track { animation: none; width: auto; } .pr .marquee ul { flex-wrap: wrap; justify-content: center; gap: 14px 24px; padding: 0; } .pr .marquee ul + ul { display: none; } }
.pr .usp { display: grid; grid-template-columns: 33px 1fr; column-gap: 16px; }
.pr .usp .ic { width: 33px; height: 32px; display: grid; place-items: center; }
.pr .usp .ic .ms { font-size: 22px; color: #0f0f0f; }
.pr .usps { display: flex; flex-direction: column; gap: 16px; }
.pr .usps hr { border: 0; border-top: 1px solid #d6d6d6; }
.pr .foot { border-top: 1px solid #e4e4e7; margin: 0 16px; padding: 16px 0; display: flex; flex-direction: column; gap: 8px; align-items: center; font: 300 12px/14px var(--geist); text-align: center; }
.pr .foot button { font: inherit; }

/* message */
.pr .msg { display: flex; flex-direction: column; gap: 24px; }
.pr .msg.ic { gap: 16px; }
.pr .msg .bigic { display: flex; justify-content: center; }
.pr .msg .tx { display: flex; flex-direction: column; gap: 16px; }
.pr .msg.ic .tx { gap: 16px; }
.pr .opts { display: flex; flex-direction: column; gap: 16px; }
.pr .opt { display: grid; grid-template-columns: 33px 1fr 24px; column-gap: 16px; align-items: center; text-align: left; width: 100%; }
.pr .opts hr { border: 0; border-top: 1px solid #d6d6d6; }

/* profile */
.pr .form { display: flex; flex-direction: column; gap: 16px; }
.pr .pair { display: grid; grid-template-columns: 88px 1fr; gap: 8px; }
.pr .tf select { appearance: none; -webkit-appearance: none; flex: 1; width: 100%; height: 24px; color: #18181b; }
.pr .tf select.ph { color: var(--muted); }

/* toast */
.pr .toast { position: absolute; left: 15px; top: 740px; width: 360px; min-height: 56px; background: #000; border-radius: 8px; display: flex; align-items: center; color: #fff; z-index: 5; }
.pr .toast .tic { width: 56px; display: grid; place-items: center; align-self: stretch; }
.pr .toast .tic .ms { font-size: 24px; font-weight: 600; }
.pr .toast .tm { flex: 1; font: 300 14px/16px var(--geist); padding: 16px 0; }
.pr .toast .ta { padding: 16px; font: 600 14px/16px var(--geist); color: #fff; display: flex; align-items: center; gap: 6px; }

/* keyboard (Type=Email; numeric pads approximate) */
.pr .kb { position: absolute; left: 0; right: 0; bottom: 0; height: 332px; z-index: 6; background: rgba(209,212,217,.94); backdrop-filter: blur(8px); padding-top: 24px; font-family: var(--sf); }
.pr .kb .rows { display: flex; flex-direction: column; gap: 11px; padding: 0 6.67px; }
.pr .kb .r { display: flex; gap: 6px; justify-content: center; }
.pr .kb .k { height: 43px; min-width: 32px; border-radius: 8.5px; background: #fff; box-shadow: 0 1px 0 rgba(0,0,0,.3); font: 400 25px/30px var(--sf); color: #000; display: grid; place-items: center; }
.pr .kb .k.sp { background: #abb0ba; font-size: 18px; }
.pr .kb .k.sp.lt { background: #fff; }
.pr .kb .bot { display: flex; justify-content: space-between; padding: 23px 32px 0; }
.pr .kb .bot .ms { font-size: 27px; color: #000; font-weight: 400; }
.pr .kb.num .rows { gap: 7px; padding: 0 6px; }
.pr .kb.num .k { flex: 1; height: 46px; flex-direction: column; display: flex; justify-content: center; align-items: center; line-height: 1; }
.pr .kb.num .k small { font: 600 10px/12px var(--sf); letter-spacing: 2px; }
.pr .kb.num .k.blank { background: transparent; box-shadow: none; }

/* SMS banner */
.pr .pop { position: absolute; left: 24px; top: 56px; width: 343px; min-height: 111px; border-radius: 18px; background: rgba(211,211,211,.92); backdrop-filter: blur(33px); z-index: 7; display: flex; gap: 10px; padding: 14px; text-align: left; font-family: var(--sf); color: #000; }
.pr .pop .appic { width: 38px; height: 38px; border-radius: 9px; background: #fff; display: grid; place-items: center; flex: none; overflow: hidden; }
.pr .pop b { font: 700 16px/20px var(--sf); display: block; }
.pr .pop span { font: 400 16px/21px var(--sf); }

/* gmail */
.pr .gm { display: flex; flex-direction: column; gap: 23px; padding: 16px; }
.pr .gm .search { height: 44px; border-radius: 2000px; background: #f7f8fc; display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; font: 400 16px/22px var(--sf); color: #333; }
.pr .gm .av { width: 28px; height: 28px; border-radius: 50%; background: #c9b8a6; }
.pr .gm .lbl { font: 400 14px/16px var(--sf); color: #4f4f4f; }
.pr .gm .mail { display: grid; grid-template-columns: 40px 1fr 50px; column-gap: 17px; text-align: left; width: 100%; }
.pr .gm .mail .a { width: 40px; height: 40px; border-radius: 9999px; }
.pr .gm .mail b { font: 700 16px/24px var(--geist); color: var(--body); display: block; }
.pr .gm .mail .t { font: 500 12px/16px var(--geist); color: #292929; display: flex; flex-direction: column; align-items: flex-end; gap: 17px; }
.pr .gm .mail .t .ms { font-size: 17px; color: #fbbc05; }

/* device-approval (E2-05) */
.pr .appr { display: flex; flex-direction: column; gap: 24px; }
.pr .appr .row { display: grid; grid-template-columns: 33px 1fr; column-gap: 16px; }
.pr .appr .row .ms { font-size: 24px; color: #0f0f0f; padding: 4px; }
.pr .appr .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
